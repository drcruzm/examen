
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profesor · Sistema de Exámenes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5;color:#1a1a2e;line-height:1.5}
.topbar{background:#1a1a2e;color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar h1{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.topbar-nav{display:flex;gap:4px;flex-wrap:wrap}
.topbar-nav button{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:rgba(255,255,255,.7);background:transparent;border:none;font-family:inherit;transition:.15s}
.topbar-nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.topbar-nav button.active{background:rgba(255,255,255,.15);color:#fff}
.container{max-width:980px;margin:0 auto;padding:24px}
.page{display:none}.page.active{display:block}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:24px;margin-bottom:20px}
.card h2{font-size:17px;font-weight:600;margin-bottom:16px;color:#1a1a2e;display:flex;align-items:center;gap:8px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:14px;font-family:inherit;background:#fafafa;transition:.15s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:#4f46e5;background:#fff}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{padding:10px 20px;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#4f46e5;color:#fff}.btn-primary:hover{background:#4338ca}
.btn-success{background:#059669;color:#fff}.btn-success:hover{background:#047857}
.btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-outline{background:transparent;border:1px solid #d1d5db;color:#374151}.btn-outline:hover{background:#f3f4f6}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-block{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:#666;font-weight:600;padding:10px 12px;border-bottom:2px solid #e5e7eb;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td{padding:10px 12px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:hover td{background:#f9fafb}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-correct{background:#d1fae5;color:#065f46}
.badge-incorrect{background:#fee2e2;color:#991b1b}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-graded{background:#dbeafe;color:#1e40af}
.alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.alert-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.alert-success{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.section-divider{border:none;border-top:1px solid #e5e7eb;margin:20px 0}
.q-block{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:16px;margin-bottom:12px}
.q-num{font-size:11px;font-weight:700;color:#4f46e5;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.q-type-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;margin-left:8px}
.q-type-numerica{background:#dbeafe;color:#1e40af}
.q-type-multiple{background:#fce7f3;color:#9d174d}
.q-type-vf{background:#fef3c7;color:#92400e}
.answer-config{margin-top:10px;padding:12px;background:#fff;border:1px dashed #d1d5db;border-radius:6px}
.config-title{font-size:11px;font-weight:700;color:#4f46e5;text-transform:uppercase;margin-bottom:8px}
.student-chip{display:inline-flex;align-items:center;gap:6px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:20px;padding:4px 10px 4px 12px;font-size:13px;margin:3px}
.student-chip .chip-remove{background:none;border:none;cursor:pointer;color:#6366f1;font-size:16px;font-weight:700;line-height:1;padding:0 2px}
